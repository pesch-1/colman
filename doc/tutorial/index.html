<!-- Landing page of the tutorial site on GitHub Pages; assembled by
     .github/workflows/tutorial.yml next to the per-language output. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colman Tutorial</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #222222;
      --muted: #666666;
      --accent: #2a6496;
      --border: #dddddd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --card: #2a2a2d;
        --text: #eeeeee;
        --muted: #aaaaaa;
        --accent: #7fb3e0;
        --border: #444444;
      }
    }
    body {
      margin: 0;
      padding: 2rem 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      text-align: center;
    }
    img.logo {
      width: 8rem;
      height: auto;
      border-radius: 1rem;
    }
    p.lead {
      color: var(--muted);
    }
    .languages {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
      gap: 1rem;
      margin-top: 2rem;
    }
    .language {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
    }
    .language h2 {
      margin: 0 0 0.75rem;
      font-size: 1.25rem;
    }
    a {
      color: var(--accent);
    }
    .language a {
      display: block;
      margin: 0.25rem 0;
    }
    footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="colman_logo.jpeg" alt="colman logo">
    <h1>Colman</h1>
    <p class="lead">
      Step-by-step guide for the school library management software<br>
      Schritt-für-Schritt-Anleitung für die Schulbibliotheks-Software
    </p>
    <div class="languages">
      <section class="language" lang="de">
        <h2>Deutsch</h2>
        <a href="de/index.html">Online lesen</a>
        <a href="de/colman_tutorial.pdf">PDF herunterladen</a>
      </section>
      <section class="language" lang="en">
        <h2>English</h2>
        <a href="en/index.html">Read online</a>
        <a href="en/colman_tutorial.pdf">Download PDF</a>
      </section>
    </div>
    <footer>
      <a href="https://github.com/pesch-1/colman">Source code on GitHub</a>
    </footer>
  </main>
</body>
</html>
